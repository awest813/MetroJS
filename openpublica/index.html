<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPublica</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" tabindex="0" aria-label="City map"></canvas>
      <aside id="left-rail">
        <div id="toolbar"></div>
        <div id="overlay-bar"></div>
        <div id="city-menu"></div>
      </aside>
      <div id="city-hud"></div>
      <div id="budget-panel"></div>
      <div id="camera-bar"></div>
      <div id="status-bar" aria-live="polite">Paint with the left mouse. Orbit with middle-drag, Alt+left, or Space+left. Pan with right-drag. Zoom the wheel. Keys 1–3 change the view.</div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
