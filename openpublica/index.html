<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPublica</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233a6b4a'/%3E%3Crect x='3' y='6' width='4' height='7' fill='%23f2e6c9'/%3E%3Crect x='9' y='3' width='4' height='10' fill='%23f2e6c9'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" tabindex="0" aria-label="City map"></canvas>
      <aside id="left-rail">
        <div id="toolbar"></div>
        <div id="overlay-bar"></div>
        <div id="city-menu"></div>
        <div id="settings-panel"></div>
      </aside>
      <div id="city-hud"></div>
      <div id="milestone-banner" hidden></div>
      <div id="bailout-dialog" hidden></div>
      <div id="newgame-panel" hidden></div>
      <div id="budget-panel"></div>
      <div id="camera-bar"></div>
      <div id="look-panel"></div>
      <div id="status-bar" aria-live="polite">Paint a street, zone lots beside it, then place a power plant. R road · I inspect · P pause.</div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
