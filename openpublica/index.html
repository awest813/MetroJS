<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenPublica</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" tabindex="0" aria-label="City map"></canvas>
      <aside id="left-rail">
        <div id="toolbar"></div>
        <div id="overlay-bar"></div>
        <div id="city-menu"></div>
        <div id="settings-panel"></div>
      </aside>
      <div id="city-hud"></div>
      <div id="budget-panel"></div>
      <div id="camera-bar"></div>
      <div id="look-panel"></div>
      <div id="status-bar" aria-live="polite">Paint a road, zone lots, drop a plant. City menu saves in this browser (Ctrl+S). Settings has mute, quality, and sun. P pause · M mute · Home frame.</div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
